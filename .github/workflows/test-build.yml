name: Unit Tests And Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python ModuleUpdate.py --yes --force --append "WebHostLib/requirements.txt"
          python -m pip install typing_extensions==4.15.0
          python -m pip install regex

      - name: Run Parser
        run: |
          python -m worlds/sonic_heroes/rule_parser/rule_parser.py

      - uses: Eijebong/ap-actions/ap-tests@main
        with:
          apworld-path: worlds/sonic_heroes
          ap-version: '0.6.8'
          python-version: '3.13'

      - name: Build APWorld
        run: |
          python Launcher.py "Build APWorlds"

      - name: Generate Template
        run: |
          python Launcher.py "Generate Template Options"

#      - name: Fix template AP version
#        this changes template YAML required version to 0.6.8
#        run: |
#          sed -i '0,/version: 0\.6\.8/s//version: 0.6.8/' \
#            "Players/Templates/Sonic Heroes.yaml"

      - name: Upload APWorld
        uses: actions/upload-artifact@v4
        with:
          name: sonic-heroes-apworld
          path: build/apworlds/sonic-heroes.apworld

      - name: Upload Template
        uses: actions/upload-artifact@v4
        with:
          name: sonic-heroes-template
          path: Players/Templates/Sonic Heroes.yaml